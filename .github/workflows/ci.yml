name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch: a new push cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server and client
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      # Boots the real Express app on pg-mem and drives it over HTTP: middleware
      # chain, RBAC, outbox delivery, provider webhooks and MFA enrollment.
      - name: PostgreSQL runtime smoke test
        run: npm run smoke:postgres

      - name: Build server and client
        run: npm run build

      - name: Upload the client bundle
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7
